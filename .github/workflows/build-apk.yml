name: Build APK

on:
  push:
    branches: [ develop, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'

      - name: Clean and get deps
        run: |
          cd mobile/delivery_app
          flutter clean
          rm -rf pubspec.lock
          flutter pub get

      - name: Build APK (with full output)
        run: |
          cd mobile/delivery_app
          flutter build apk --release --verbose

      - name: List all build files
        run: |
          cd mobile/delivery_app
          echo "=== Full tree of build/ ==="
          find build -type f -name "*.apk" -o -name "*.aar" -o -name "*.jar" | head -50
          echo "=== APK search ==="
          find . -name "*.apk" -type f
          echo "=== Check standard path ==="
          ls -la build/app/outputs/flutter-apk/ || echo "Standard path not found"
          ls -la build/app/outputs/apk/ || echo "APK path not found"

      - name: Upload any APK found
        uses: actions/upload-artifact@v4
        with:
          name: any-apk
          path: |
            mobile/delivery_app/**/*.apk