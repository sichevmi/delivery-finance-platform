name: Build APK

on:
  push:
    branches: [ develop, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
          cache: false

      - name: Install dependencies
        working-directory: mobile/delivery_app
        run: flutter pub get

      - name: Build APK (debug) 
        working-directory: mobile/delivery_app
        run: flutter build apk --debug -t lib/apps/delivery/main_delivery.dart

      - name: Upload to Transfer.sh
        working-directory: mobile/delivery_app
        run: |
          echo "Download APK from:"
          curl --upload-file build/app/outputs/flutter-apk/app-debug.apk https://transfer.sh/app-debug.apk

      - name: Upload APK artifact (try)
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: mobile/delivery_app/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 1