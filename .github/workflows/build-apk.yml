name: Build APK

on:
  push:
    branches: [ develop, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'

      - name: Clean Flutter project
        run: |
          cd mobile/delivery_app
          flutter clean

      - name: Clear Gradle cache
        run: |
          rm -rf ~/.gradle/caches/
          rm -rf mobile/delivery_app/android/.gradle

      - name: Get dependencies with upgrade
        run: |
          cd mobile/delivery_app
          flutter pub upgrade shared_preferences
          flutter pub get

      - name: Build APK
        run: | 
          cd mobile/delivery_app
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: mobile/delivery_app/build/app/outputs/flutter-apk/app-release.apk