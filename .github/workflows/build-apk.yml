name: Build APK

on:
  push:
    branches: [ develop, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'

      - name: Clean and get deps
        run: |
          cd mobile/delivery_app
          flutter clean
          rm -rf pubspec.lock
          flutter pub get

      - name: Build APK with verbose output
        run: |
          cd mobile/delivery_app
          flutter build apk --release --verbose
        continue-on-error: true   # позволит продолжить даже при ошибке

      - name: List build folder (if exists)
        run: |
          ls -la mobile/delivery_app/build/ || echo "Build folder not found"
          ls -la mobile/delivery_app/build/app/outputs/flutter-apk/ || echo "APK folder not found"

      - name: Upload APK if exists
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: mobile/delivery_app/build/app/outputs/flutter-apk/app-release.apk
        if: success() || failure()   # загружаем даже если сборка упала (если APK всё же создан)