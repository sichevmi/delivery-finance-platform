name: Build APK

on:
  #push:
   # branches: [ develop, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'

      - name: Get dependencies
        run: |
          cd mobile/delivery_app
          flutter pub get

      - name: Build APK with gradlew
        run: |
          cd mobile/delivery_app/android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Find and upload APK
        run: |
          cd mobile/delivery_app
          echo "=== Searching for APK ==="
          find . -name "*.apk" -type f
          APK_PATH=$(find . -name "*.apk" -type f | head -n 1)
          if [ -n "$APK_PATH" ]; then
            cp "$APK_PATH" ./app-debug.apk
            echo "APK found and copied: $APK_PATH"
          else
            echo "No APK found!"
            exit 1
          fi

      - name: Upload APK 
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: mobile/delivery_app/app-debug.apk
          retention-days: 7