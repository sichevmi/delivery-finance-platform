name: Build APK

on:
  push:
    branches: [ develop, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'

      - name: Clean and get deps
        run: |
          cd mobile/delivery_app
          flutter clean
          rm -rf pubspec.lock
          flutter pub get

      - name: Build APK with verbose
        run: |
          cd mobile/delivery_app
          flutter build apk --release --verbose

      - name: Find and copy APK
        run: |
          cd mobile/delivery_app
          echo "Searching for APK files..."
          find . -name "*.apk" -type f
          # Копируем первый найденный APK в корень с именем app.apk
          APK_PATH=$(find . -name "*.apk" -type f | head -n 1)
          if [ -n "$APK_PATH" ]; then
            cp "$APK_PATH" ./app.apk
            echo "APK copied from $APK_PATH"
          else
            echo "No APK found"
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: mobile/delivery_app/app.apk