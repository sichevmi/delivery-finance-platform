name: Build APK

on:
  push:
    branches: [ develop, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'

      - name: Clean and get deps
        run: |
          cd mobile/delivery_app
          flutter clean
          rm -rf pubspec.lock
          flutter pub get

      - name: Build APK
        run: |
          cd mobile/delivery_app
          flutter build apk --release

      - name: Find and copy APK
        run: |
          cd mobile/delivery_app
          # Найдём все APK-файлы и скопируем их в корень для надёжности
          find . -name "*.apk" -type f -exec cp {} ./app.apk \;
          # Проверим, что скопировалось
          ls -la app.apk || echo "No APK found"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: mobile/delivery_app/app.apk
        if: success() || failure()   # загрузим даже если сборка упала, но APK есть