name: Deploy to Test (finflow.ru)

on:
  push:
    branches: [ develop ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: test

    steps:
      # 2. Деплой через SSH
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.TEST_HOST }}
          username: ${{ secrets.TEST_USER }}
          password: ${{ secrets.TEST_PASSWORD }}
          script: |
            cd /var/www/delivery-finance-platform
            
            # Обновляем код из репозитория
            git pull origin develop
            
            # Запускаем миграции (если есть изменения)
            # Предполагается, что у вас есть виртуальное окружение и alembic настроен
            cd backend
            source venv/bin/activate
            alembic upgrade head
            
            # Перезапускаем сервисы (если используете docker-compose)
            cd ../infrastructure
            docker-compose down
            docker-compose up -d --build
            
            # Или если используете systemd / supervisor, перезапустите процесс
            # systemctl restart finflow-backend