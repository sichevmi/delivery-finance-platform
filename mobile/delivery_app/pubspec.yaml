name: delivery_app
description: FinFlow delivery app
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # ===== STATE MANAGEMENT =====
  riverpod: ^2.4.0
  flutter_riverpod: ^2.4.0
  
  # ===== NETWORK =====
  dio: ^5.4.0
  flutter_secure_storage: ^9.0.0
  http: ^1.1.0
  
  # ===== GPS & LOCATION =====
  geolocator: ^8.0.1
  permission_handler: ^10.2.0
  flutter_foreground_task: ^8.17.0
  device_info_plus: ^11.2.2
  shared_preferences: ^2.2.2

    # Logging
  flutter_logs: ^2.0.10
  
  # ===== UI & HELPERS =====
  cupertino_icons: ^1.0.6
  fl_chart: ^0.68.0
  share_plus: ^7.0.0
  intl: ^0.19.0
  email_validator: ^2.1.17
  logger: ^2.0.2
  
  # ===== JSON =====
  json_annotation: ^4.8.0
  

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  
  # ===== DATABASE GENERATION =====
  drift_dev: ^2.14.0
  build_runner: ^2.4.0
  json_serializable: ^6.7.0

flutter:
  uses-material-design: true